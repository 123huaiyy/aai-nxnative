# nxnative's iOS app for one game with placeholder module sections (ci/build_shell.py): no game files, keys or game-derived data.
# The layout input holds only numbers and IDs (module sizes and offsets, the derived game.tsv with build IDs and display version).
name: PRAGMATA performance
run-name: PRAGMATA iOS cutscene revision and launcher language selector

on:
  workflow_dispatch:
  push:
    branches: [verify/pragmata-menu-language-20261125-054127]
    paths: ['.github/workflows/pragmata-performance.yml']

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer   # nxnative's toolchain (README: Xcode 27.2), as its own CI names it

jobs:
  shell:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cheemu21/guy-with-a-kid-on-his-back
          ref: 6e3855c1dd3ff198f7a24cdd581641c23b3da5e7
          path: nxnative
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
          command -v xcodegen || brew install xcodegen
          python3 -m pip install fonttools
      - name: Apply the touch artwork and controls
        run: |
          git -C nxnative apply --check "$GITHUB_WORKSPACE/ci/patches/pragmata-touch.patch"
          git -C nxnative apply "$GITHUB_WORKSPACE/ci/patches/pragmata-touch.patch"
          cp "$GITHUB_WORKSPACE/ci/art/PragmataTouch.png" nxnative/dm/ios/Sources/
      - name: Apply the performance patch
        run: |
          git -C nxnative apply --check "$GITHUB_WORKSPACE/ci/patches/pragmata-performance.patch"
          git -C nxnative apply "$GITHUB_WORKSPACE/ci/patches/pragmata-performance.patch"
      - name: Layout
        env:
          LAYOUT: 
        run: |
          echo "$LAYOUT" | base64 --decode > "$RUNNER_TEMP/layout.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: v for k, v in d.items() if k != "game_tsv"}, indent=1)); print(d.get("game_tsv", ""))' "$RUNNER_TEMP/layout.json"
      - name: Check the ultrawide interface geometry
        working-directory: nxnative
        run: |
          cat > "$RUNNER_TEMP/pragmata_ui_check.c" <<'EOF'
          #include <assert.h>
          #include <math.h>
          #undef NDEBUG
          #include "dm/gfx/nvn/pragmata_ui_viewport.h"
          int main(void) {
              const char *text = "d84fd24ea0cd67c4_b";
              assert(pragmata_ui_target(text, 1600, 900, true));
              assert(pragmata_ui_target(text, 1280, 720, true));
              assert(!pragmata_ui_target(text, 512, 512, true));
              assert(!pragmata_ui_target(text, 1600, 900, false));
              assert(!pragmata_ui_target("79cf7cf02d1d7e72_b", 1600, 900, true));
              for (int n = 0; n <= 1600; n += 50) {
                  const double stock_x = n / 1600.0 * 1600;
                  const double wide_x = pragmata_ui_x(n, 1600) / 1600.0 * 2100;
                  assert(fabs(wide_x - 250 - stock_x) < 0.000001);
              }
              return 0;
          }
          EOF
          clang -std=c11 -Wall -Wextra -Werror -I . "$RUNNER_TEMP/pragmata_ui_check.c" -o "$RUNNER_TEMP/pragmata_ui_check"
          "$RUNNER_TEMP/pragmata_ui_check"
      - name: Verify the 6 GiB memory policy
        working-directory: nxnative
        run: |
          cat > "$RUNNER_TEMP/pragmata_memory_test.c" <<'EOF'
          #include <assert.h>
          #include "dm/gfx/nvn/pragmata_memory.h"
          int main(void) {
              const char *g = "0400C76024710000";
              assert(pragmata_memory_mode(g, NULL, 6144 * PRAGMATA_MIB, 12288 * PRAGMATA_MIB));
              assert(pragmata_memory_mode(g, NULL, 8192 * PRAGMATA_MIB, 8192 * PRAGMATA_MIB));
              assert(!pragmata_memory_mode(g, NULL, 8192 * PRAGMATA_MIB, 12288 * PRAGMATA_MIB));
              assert(!pragmata_memory_mode(g, "0", 6144 * PRAGMATA_MIB, 8192 * PRAGMATA_MIB));
              assert(!pragmata_memory_mode("other", "1", 6144 * PRAGMATA_MIB, 8192 * PRAGMATA_MIB));
              assert(pragmata_sparse_chunk_min(true, true) == 128 * PRAGMATA_MIB);
              assert(pragmata_sparse_chunk_min(true, false) == 512 * PRAGMATA_MIB);
              assert(pragmata_sparse_cache_bytes(true, false) == 192 * PRAGMATA_MIB);
              assert(pragmata_sparse_cache_bytes(true, true) == 128 * PRAGMATA_MIB);
              assert(!pragmata_memory_pressure(5200 * PRAGMATA_MIB, PRAGMATA_6_GIB, 1400 * PRAGMATA_MIB, false));
              assert(pragmata_memory_pressure(5200 * PRAGMATA_MIB, PRAGMATA_6_GIB, 1400 * PRAGMATA_MIB, true));
              assert(pragmata_memory_pressure(5400 * PRAGMATA_MIB, PRAGMATA_6_GIB, 1400 * PRAGMATA_MIB, false));
              assert(pragmata_memory_pressure(4600 * PRAGMATA_MIB, PRAGMATA_6_GIB, 600 * PRAGMATA_MIB, false));
              assert(!pragmata_memory_pressure(4600 * PRAGMATA_MIB, PRAGMATA_6_GIB, 1400 * PRAGMATA_MIB, true));
              return 0;
          }
          EOF
          clang -std=c11 -Wall -Wextra -Werror -I . "$RUNNER_TEMP/pragmata_memory_test.c" -o "$RUNNER_TEMP/pragmata_memory_test"
          "$RUNNER_TEMP/pragmata_memory_test"
      - name: Check movie pixel layout and decoder behavior
        working-directory: nxnative/dm/host/tests
        run: |
          make -j 3 GAME=01006F8002326000 build/t_movie_avc build/t_codec_video
          ./build/t_movie_avc
          echo "::notice::Full codec lifecycle test needs hardware-backed AV1. Compiled here; synthetic AVC tests ran."
      - name: Verify launcher language lookup
        working-directory: nxnative
        run: |
          cat > "$RUNNER_TEMP/main.swift" <<'EOF'
          import Foundation
          precondition(LauncherLanguage.allCases.count == 9)
          precondition(LauncherLanguage.resolve("system", preferred: ["zh-HK"]).rawValue == "zh-Hant")
          precondition(LauncherLanguage.resolve("system", preferred: ["it-IT", "ja-JP"]) == .ja)
          precondition(LauncherLanguage.resolve("invalid value", preferred: ["fi-FI"]) == .en)
          precondition(LauncherLanguage.resolve("fr", preferred: ["ja-JP"]) == .fr)
          for language in LauncherLanguage.allCases where language != .en && language != .system {
              for key in ["Menu language", "PLAY", "Game language", "Texture saver"] {
                  precondition(language.text(key) != key)
              }
          }
          precondition(LauncherLanguage.zhHans.text("Menu language") == "菜单语言")
          precondition(LauncherLanguage.zhHant.text("Menu language") == "菜單語言")
          precondition(LauncherLanguage.de.text("Unrecognized future setting") == "Unrecognized future setting")
          EOF
          swiftc dm/ios/Sources/LauncherLanguage.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/pragmata-language"
          "$RUNNER_TEMP/pragmata-language"
      - name: Build the app
        run: python3 ci/ci/build_shell.py --repo nxnative --layout "$RUNNER_TEMP/layout.json" --output "$RUNNER_TEMP/shell"
      - name: Compile GPU tests and check CPU feedback
        working-directory: nxnative/dm/gfx/tests
        run: |
          make GAME=0400C76024710000 t_gpu_lost t_arena_trim t_gmem_words
          ./t_gpu_lost --feedback-only
          if ./t_gpu_lost --check-device; then
            make GAME=0400C76024710000 check_t_gpu_lost check_t_arena_trim check_t_gmem_words
          else
            echo "::notice::The virtual runner has no Metal 4 device. GPU execution remains untested."
          fi
      - name: Archive
        run: |
          cd "$RUNNER_TEMP/shell/out"
          ditto -c -k --sequesterRsrc --keepParent DmIOS.app "$GITHUB_WORKSPACE/DmIOS-shell.zip"
          cp shell.json "$GITHUB_WORKSPACE/shell.json"
          ls -la "$GITHUB_WORKSPACE"/DmIOS-shell.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PRAGMATA performance
          path: |
            DmIOS-shell.zip
            shell.json
          retention-days: 30
