# nxnative's iOS app for one game with placeholder module sections (ci/build_shell.py): no game files, keys or game-derived data.
# The layout input holds only numbers and IDs (module sizes and offsets, the derived game.tsv with build IDs and display version).
name: Legacy port layout and auto-hide gear

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy-layout-autogear.yml']

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer   # nxnative's toolchain (README: Xcode 27.2), as its own CI names it

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: rise
            patch: rise
            layout: ""
          - game: dsr
            patch: dsr
            layout: ""
          - game: nier
            patch: nier
            layout: ""
          - game: ryza1
            patch: ryza
            layout: ""
          - game: ryza2
            patch: ryza
            layout: ""
          - game: ryza3
            patch: ryza
            layout: ""
    name: ${{ matrix.game }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: f3ec8fc81e49744d178379a38ceae0fc1cba04d0
          path: nxnative
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
          command -v xcodegen || brew install xcodegen
          python3 -m pip install fonttools
      - name: Apply the existing game host and the new touch controls
        run: |
          case '${{ matrix.patch }}' in
            rise) original=mhr-controls.patch ;;
            dsr) original=dsr-ios26-controls.patch ;;
            nier) original=nier-controls.patch ;;
            ryza) original=ryza-controls.patch ;;
          esac
          git -C nxnative apply --whitespace=nowarn "$GITHUB_WORKSPACE/ci/patches/$original"
          cp "ci/patches/legacy-${{ matrix.patch }}-layout.patch" "$RUNNER_TEMP/hogwarts-layout.patch"
          git -C nxnative apply --check --whitespace=nowarn "$RUNNER_TEMP/hogwarts-layout.patch"
          git -C nxnative apply --whitespace=nowarn "$RUNNER_TEMP/hogwarts-layout.patch"
      - name: Layout
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          echo "$LAYOUT" | base64 --decode > "$RUNNER_TEMP/layout.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: v for k, v in d.items() if k != "game_tsv"}, indent=1)); print(d.get("game_tsv", ""))' "$RUNNER_TEMP/layout.json"
      - name: Build the app
        run: python3 ci/ci/build_shell.py --repo nxnative --layout "$RUNNER_TEMP/layout.json" --output "$RUNNER_TEMP/shell"
      - name: Archive
        run: |
          cd "$RUNNER_TEMP/shell/out"
          ditto -c -k --sequesterRsrc --keepParent DmIOS.app "$GITHUB_WORKSPACE/DmIOS-shell.zip"
          cp shell.json "$GITHUB_WORKSPACE/shell.json"
          ls -la "$GITHUB_WORKSPACE"/DmIOS-shell.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-${{ matrix.game }}-layout
          path: |
            DmIOS-shell.zip
            shell.json
          retention-days: 30
