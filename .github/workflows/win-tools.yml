# Windows builds of nxnative's three translation/extraction tools, from their official sources (no game files, keys or game-derived data):
#   nx_extract  (seedds/nxnative dm/tools/nx_extract, LibHac from NuGet)
#   dmsh_xlate  (seedds/nxnative dm/gfx/tools/dmsh_xlate, Ryujinx's shader translator kept in that repository)
#   spirv-cross (KhronosGroup/SPIRV-Cross at the tag nxnative pins, dm/gfx/tools/spirv_cross_bin/build.sh)
name: win-tools

on:
  workflow_dispatch:
    inputs:
      nxnative_sha:
        description: seedds/nxnative commit to build from
        required: true

permissions:
  contents: read

jobs:
  tools:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          ref: ${{ inputs.nxnative_sha }}
          path: nxnative
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: nx_extract (NativeAOT, win-x64)
        shell: pwsh
        run: dotnet publish nxnative/dm/tools/nx_extract/nx_extract.csproj -c Release -r win-x64 -nologo -o out/nx_extract
      - name: dmsh_xlate (NativeAOT, win-x64)
        shell: pwsh
        run: dotnet publish nxnative/dm/gfx/tools/dmsh_xlate/dmsh_xlate.csproj -c Release -r win-x64 -nologo -o out/dmsh_xlate
      - name: SPIRV-Cross at nxnative's pinned tag
        shell: bash
        run: |
          set -eu
          TAG=$(sed -n 's/^TAG=\([^ ]*\).*/\1/p' nxnative/dm/gfx/tools/spirv_cross_bin/build.sh)
          COMMIT=$(sed -n 's/^COMMIT=\([0-9a-f]*\).*/\1/p' nxnative/dm/gfx/tools/spirv_cross_bin/build.sh)
          echo "SPIRV-Cross $TAG ($COMMIT)"
          git clone --quiet --depth 1 --branch "$TAG" https://github.com/KhronosGroup/SPIRV-Cross.git sc
          test "$(git -C sc rev-parse HEAD)" = "$COMMIT"
          cmake -S sc -B scb -DSPIRV_CROSS_ENABLE_TESTS=OFF -DSPIRV_CROSS_SKIP_INSTALL=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build scb --config Release --target spirv-cross -j 4
          mkdir -p out/spirv-cross
          cp scb/Release/spirv-cross.exe out/spirv-cross/
          cp sc/LICENSE out/spirv-cross/
          cp -R sc/LICENSES out/spirv-cross/
          echo "$TAG $COMMIT" > out/spirv-cross/VERSION.txt
      - name: Smoke test
        shell: pwsh
        run: |
          ./out/nx_extract/nx_extract.exe --source-sha
          ./out/dmsh_xlate/dmsh_xlate.exe --source-sha
          ./out/spirv-cross/spirv-cross.exe --revision
          "${{ inputs.nxnative_sha }}" | Out-File -Encoding ascii out/NXNATIVE_SHA.txt
          Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-tools
          path: out
          retention-days: 30
