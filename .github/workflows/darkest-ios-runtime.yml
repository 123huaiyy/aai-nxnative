name: Darkest iOS SDK runtime
on:
  push:
    branches: [build/darkest-ios-20261128-070550]
jobs:
  device:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare public source and host shader tools
        run: |
          brew install glslang spirv-cross
          curl --fail --location --retry 3 -o swarc.tar.gz https://codeload.github.com/JTM-rootstorm/SwARc/tar.gz/9170ecc1ebea55ef48a0a7b9c10882711dd3c213
          mkdir swarc
          tar -xzf swarc.tar.gz --strip-components=1 -C swarc
          cp -R darkest-ios-runtime/swarc-overlay/. swarc/
      - name: Compile the iPhoneOS runtime
        run: |
          cmake -S darkest-ios-runtime -B ios-build -G Ninja \
            -DSWARC="$PWD/swarc" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          cmake --build ios-build --target DarkestRuntime --parallel 6
      - name: Export the SDK runtime for local linking
        run: |
          xcrun vtool -show-build ios-build/DarkestRuntime.framework/DarkestRuntime
          xcrun otool -L ios-build/DarkestRuntime.framework/DarkestRuntime
          mkdir -p sdk-stage/Darkest.app/Frameworks
          cp darkest-ios-runtime/Info.plist sdk-stage/Darkest.app/Info.plist
          ditto ios-build/DarkestRuntime.framework sdk-stage/Darkest.app/Frameworks/DarkestRuntime.framework
          xcrun plutil -lint sdk-stage/Darkest.app/Info.plist
          ditto -c -k --keepParent sdk-stage/Darkest.app Darkest-iOS-SDK-runtime.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: darkest-ios-sdk-runtime
          path: Darkest-iOS-SDK-runtime.zip
          if-no-files-found: error
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare public source and host shader tools
        run: |
          brew install glslang spirv-cross
          curl --fail --location --retry 3 -o swarc.tar.gz https://codeload.github.com/JTM-rootstorm/SwARc/tar.gz/9170ecc1ebea55ef48a0a7b9c10882711dd3c213
          mkdir swarc
          tar -xzf swarc.tar.gz --strip-components=1 -C swarc
          cp -R darkest-ios-runtime/swarc-overlay/. swarc/
      - name: Run the guest startup and graphics test on iOS Simulator
        run: |
          set -euo pipefail
          cmake -S darkest-ios-runtime -B ios-simulator -G Ninja \
            -DSWARC="$PWD/swarc" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DDARKEST_RUNTIME_SMOKE=ON
          cmake --build ios-simulator --target DarkestRuntimeSmoke --parallel 6
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in reversed(d) for x in d[k] if ".iOS-" in k and x["name"].startswith("iPhone")))' )"
          app="ios-simulator/DarkestRuntimeSmoke.app"
          id="org.aai.darkest.runtime-smoke"
          codesign -f -s - "$app/Frameworks/DarkestRuntime.framework"
          codesign -f -s - "$app"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$id"
          data="$(xcrun simctl get_app_container "$device" "$id" data)"
          for i in $(seq 1 45); do
            if grep -q 'SMOKE PASSED' "$data/Documents/runtime-smoke.log" 2>/dev/null; then
              cat "$data/Documents/runtime-smoke.log"
              exit 0
            fi
            if grep -q 'SMOKE FAILED\|FATAL:' "$data/Documents/runtime-smoke.log" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$data/Documents/runtime-smoke.log" || true
          xcrun simctl spawn "$device" log show --last 2m --predicate 'process == "DarkestRuntimeSmoke"' || true
          exit 1
